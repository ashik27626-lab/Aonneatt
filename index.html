<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat</title>
  <style>
    /* ========== RESET ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0b0d10;
  --bg-2: #12151a;
  --bg-3: #1a1e25;
  --border: #232830;
  --text: #e7eaf0;
  --text-dim: #8a93a3;
  --accent: #6c8cff;
  --accent-2: #8a6cff;
  --bubble-me: linear-gradient(135deg, #6c8cff, #8a6cff);
  --bubble-them: #1e232c;
  --danger: #ff5c7a;
  --radius: 16px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
.hidden { display: none !important; }

/* ========== START SCREEN ========== */
.start-screen {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: radial-gradient(circle at 50% 30%, #141a2a 0%, #0b0d10 70%);
  z-index: 10;
}
.start-inner { text-align: center; animation: fadeUp .6s ease; }
.logo {
  font-size: 56px; color: var(--accent);
  margin-bottom: 18px;
  filter: drop-shadow(0 0 24px rgba(108,140,255,.5));
  animation: pulse 3s ease-in-out infinite;
}
.start-inner h1 { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
.sub { color: var(--text-dim); margin: 8px 0 28px; font-size: 15px; }
.start-btn { padding: 14px 44px; font-size: 16px; }

/* ========== BUTTONS ========== */
.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border: none; border-radius: 12px;
  padding: 12px 22px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: transform .15s, box-shadow .2s, opacity .2s;
  box-shadow: 0 8px 24px rgba(108,140,255,.25);
}
.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(108,140,255,.4); }
.primary:active { transform: scale(.97); }
.ghost {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 22px; font-size: 15px; cursor: pointer;
  transition: background .2s, color .2s;
}
.ghost:hover { background: var(--bg-3); color: var(--text); }

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5,7,10,.75);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  z-index: 20;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  width: min(92vw, 380px);
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  transform: translateY(10px); transition: transform .25s;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal h2 { font-size: 20px; margin-bottom: 6px; }
.modal-sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 20px; }
.modal label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
.modal input {
  width: 100%;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  color: var(--text);
  font-size: 16px;
  letter-spacing: 2px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.modal input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,140,255,.15);
}
.error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* ========== CHAT AREA ========== */
.chat-area {
  display: flex; flex-direction: column;
  height: 100dvh;
  max-width: 760px; margin: 0 auto;
  background: var(--bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  animation: fadeIn .4s ease;
}
.chat-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
}
.avatar {
  position: relative;
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  font-size: 18px; color: #fff; flex-shrink: 0;
}
.online-dot {
  position: absolute; right: -1px; bottom: -1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #34d399; border: 2px solid var(--bg-2);
}
.info h3 { font-size: 16px; font-weight: 600; }
.info p { font-size: 12.5px; color: var(--text-dim); }
.info p.typing { color: var(--accent); font-style: italic; }
.logout-btn {
  margin-left: auto;
  background: transparent; border: none;
  color: var(--text-dim); font-size: 20px;
  cursor: pointer; padding: 6px 10px; border-radius: 10px;
  transition: background .2s, color .2s;
}
.logout-btn:hover { background: var(--bg-3); color: var(--text); }

/* ========== MESSAGES ========== */
.messages {
  flex: 1; overflow-y: auto;
  padding: 20px 18px;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

.msg {
  max-width: 72%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  word-wrap: break-word;
  animation: bubbleIn .22s ease;
  position: relative;
}
.msg.me {
  align-self: flex-end;
  background: var(--bubble-me);
  color: #fff;
  border-bottom-right-radius: 6px;
}
.msg.them {
  align-self: flex-start;
  background: var(--bubble-them);
  color: var(--text);
  border-bottom-left-radius: 6px;
}
.msg .time {
  display: block;
  font-size: 10.5px;
  margin-top: 4px;
  opacity: .65;
  text-align: right;
}
.msg.them .time { text-align: left; }

.empty-hint {
  text-align: center; color: var(--text-dim);
  font-size: 13.5px; margin: auto;
  padding: 20px;
}

/* ========== INPUT BAR ========== */
.input-bar {
  display: flex; gap: 10px;
  padding: 12px 14px;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
}
.input-bar input {
  flex: 1;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 13px 18px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.input-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,140,255,.15);
}
.send-btn {
  width: 46px; height: 46px; flex-shrink: 0;
  border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; font-size: 18px;
  cursor: pointer;
  transition: transform .15s, box-shadow .2s;
  box-shadow: 0 6px 20px rgba(108,140,255,.3);
}
.send-btn:hover { transform: scale(1.06); }
.send-btn:active { transform: scale(.94); }

/* ========== ANIMATIONS ========== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

/* ========== MOBILE ========== */
@media (max-width: 500px) {
  .chat-area { border: none; }
  .msg { max-width: 82%; }
}
  </style>
</head>
<body>

  <!-- ========== START SCREEN ========== -->
  <section class="start-screen" id="startScreen">
    <div class="start-inner">
      <div class="logo">✦</div>
      <h1>Private Chat</h1>
      <p class="sub">A quiet space for two.</p>
      <button class="primary start-btn" id="startBtn">Start</button>
    </div>
  </section>

  <!-- ========== KEY POPUP ========== -->
  <div class="modal-overlay" id="keyModal">
    <div class="modal">
      <h2>Enter your key</h2>
      <p class="modal-sub">Only authorized keys can enter.</p>
      <form id="setupForm">
        <div>
          <label for="key">Key</label>
          <input type="password" id="key" maxlength="8" autocomplete="off"
                 placeholder="Enter key" inputmode="numeric" required />
        </div>
        <p class="error" id="keyError"></p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="cancelBtn">Cancel</button>
          <button class="primary" type="submit">Enter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== CHAT AREA ========== -->
  <section class="chat-area hidden" id="chatArea">
    <header class="chat-header">
      <div class="avatar">✦<span class="online-dot"></span></div>
      <div class="info">
        <h3 id="chatWith">—</h3>
        <p id="statusText">Online</p>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Logout">⎋</button>
    </header>

    <div class="messages" id="messages"></div>

    <form class="input-bar" id="chatForm">
      <input id="msgInput" type="text" placeholder="Type a message..."
             autocomplete="off" />
      <button class="send-btn" type="submit">➤</button>
    </form>
  </section>

  <!-- Firebase SDK (v9 modular via CDN) -->
  <script>
    // ============================================================
//  🔥 FIREBASE CONFIG — এখানে তোর config বসা
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy, onSnapshot,
  serverTimestamp, doc, setDoc, onSnapshot as onSnapDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDZLzKuhjLeaLPD3QoVpia9XPNyvBg_r_o",
  authDomain: "aonneat.firebaseapp.com",
  databaseURL: "https://aonneat-default-rtdb.firebaseio.com",
  projectId: "aonneat",
  storageBucket: "aonneat.firebasestorage.app",
  messagingSenderId: "1030654887677",
  appId: "1:1030654887677:web:3540c94e6469e01f37a094",
  measurementId: "G-XGTL9X9N42"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================================
//  🔑 KEY → USER MAPPING
// ============================================================
const USERS = {
  "27626": { name: "Arman",  other: "Nishi" },
  "64744": { name: "Nishi",  other: "Arman" }
};
const ROOM_ID = "arman_nishi_room";       // একটাই fixed room
const TYPING_TIMEOUT = 2500;              // 2.5s idle → typing off

// ============================================================
//  DOM
// ============================================================
const $ = (id) => document.getElementById(id);
const startScreen = $("startScreen");
const startBtn    = $("startBtn");
const keyModal    = $("keyModal");
const setupForm   = $("setupForm");
const keyInput    = $("key");
const keyError    = $("keyError");
const cancelBtn   = $("cancelBtn");
const chatArea    = $("chatArea");
const chatWith    = $("chatWith");
const statusText  = $("statusText");
const messagesEl  = $("messages");
const chatForm    = $("chatForm");
const msgInput    = $("msgInput");
const logoutBtn   = $("logoutBtn");

// ============================================================
//  STATE
// ============================================================
let currentUser = null;       // "Arman" | "Nishi"
let otherUser   = null;
let unsubMessages = null;
let unsubTyping   = null;
let typingTimer   = null;
let lastTypingSent = 0;
let isSending = false;

// ============================================================
//  START FLOW
// ============================================================
startBtn.addEventListener("click", () => {
  keyModal.classList.add("show");
  keyError.textContent = "";
  keyInput.value = "";
  setTimeout(() => keyInput.focus(), 250);
});

cancelBtn.addEventListener("click", () => {
  keyModal.classList.remove("show");
});

setupForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const key = keyInput.value.trim();
  const user = USERS[key];
  if (!user) {
    keyError.textContent = "Invalid key. Try again.";
    keyInput.value = "";
    keyInput.focus();
    return;
  }
  // save login
  localStorage.setItem("chat_key", key);
  enterChat(key);
});

// auto-login on reload
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("chat_key");
  if (saved && USERS[saved]) {
    enterChat(saved);
  }
});

// ============================================================
//  ENTER CHAT
// ============================================================
async function enterChat(key) {
  const user = USERS[key];
  currentUser = user.name;
  otherUser   = user.other;

  // UI switch
  keyModal.classList.remove("show");
  startScreen.classList.add("hidden");
  chatArea.classList.remove("hidden");
  chatWith.textContent = otherUser;
  statusText.textContent = "Online";
  statusText.classList.remove("typing");
  messagesEl.innerHTML = "";

  // mark self online
  await setDoc(doc(db, "rooms", ROOM_ID, "presence", currentUser), {
    online: true,
    updatedAt: serverTimestamp()
  });

  listenMessages();
  listenTyping();
  listenPresence();
}

// ============================================================
//  MESSAGES
// ============================================================
function listenMessages() {
  if (unsubMessages) unsubMessages();
  const q = query(
    collection(db, "rooms", ROOM_ID, "messages"),
    orderBy("createdAt", "asc")
  );
  unsubMessages = onSnapshot(q, (snap) => {
    messagesEl.innerHTML = "";
    if (snap.empty) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "No messages yet. Say hi 👋";
      messagesEl.appendChild(hint);
      return;
    }
    snap.forEach((d) => {
      const m = d.data();
      renderMessage(m);
    });
    scrollToBottom();
  });
}

function renderMessage(m) {
  const div = document.createElement("div");
  div.className = "msg " + (m.sender === currentUser ? "me" : "them");
  const text = document.createElement("span");
  text.textContent = m.text;
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = formatTime(m.createdAt);
  div.appendChild(text);
  div.appendChild(time);
  messagesEl.appendChild(div);
}

function formatTime(ts) {
  if (!ts) return "";
  const date = ts.toDate ? ts.toDate() : new Date(ts);
  return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// send
chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = msgInput.value.trim();
  if (!text || isSending) return;
  isSending = true;
  msgInput.value = "";
  try {
    await addDoc(collection(db, "rooms", ROOM_ID, "messages"), {
      text,
      sender: currentUser,
      createdAt: serverTimestamp()
    });
    await clearTyping();  // typing off after send
  } catch (err) {
    console.error("send error:", err);
    // revert on error
    msgInput.value = text;
  } finally {
    isSending = false;
  }
});

// ============================================================
//  TYPING INDICATOR
// ============================================================
function listenTyping() {
  if (unsubTyping) unsubTyping();
  const ref = doc(db, "rooms", ROOM_ID, "typing", otherUser);
  unsubTyping = onSnapshot(ref, (snap) => {
    const data = snap.data();
    if (data && data.isTyping && data.updatedAt) {
      const updated = data.updatedAt.toDate
        ? data.updatedAt.toDate().getTime()
        : new Date(data.updatedAt).getTime();
      if (Date.now() - updated < 4000) {
        statusText.textContent = "typing...";
        statusText.classList.add("typing");
        return;
      }
    }
    setOnlineStatus();
  });
}

async function setTyping() {
  const now = Date.now();
  if (now - lastTypingSent < 800) return;   // throttle
  lastTypingSent = now;
  try {
    await setDoc(doc(db, "rooms", ROOM_ID, "typing", currentUser), {
      isTyping: true,
      updatedAt: serverTimestamp()
    });
  } catch (e) { /* silent */ }
}

async function clearTyping() {
  try {
    await setDoc(doc(db, "rooms", ROOM_ID, "typing", currentUser), {
      isTyping: false,
      updatedAt: serverTimestamp()
    });
  } catch (e) { /* silent */ }
}

msgInput.addEventListener("input", () => {
  setTyping();
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    clearTyping();
  }, TYPING_TIMEOUT);
});

// ============================================================
//  PRESENCE (online status)
// ============================================================
let unsubPresence = null;
function listenPresence() {
  if (unsubPresence) unsubPresence();
  const ref = doc(db, "rooms", ROOM_ID, "presence", otherUser);
  unsubPresence = onSnapshot(ref, (snap) => {
    const d = snap.data();
    const online = d && d.online;
    if (!statusText.classList.contains("typing")) {
      statusText.textContent = online ? "Online" : "Offline";
    }
  });
}

function setOnlineStatus() {
  // re-check presence doc quickly (fallback)
  const ref = doc(db, "rooms", ROOM_ID, "presence", otherUser);
  onSnapDoc(ref, (snap) => {
    const d = snap.data();
    if (!statusText.classList.contains("typing")) {
      statusText.textContent = d && d.online ? "Online" : "Offline";
    }
  }, { includeMetadataChanges: false });
}

// on unload → offline
window.addEventListener("beforeunload", () => {
  if (!currentUser) return;
  try {
    setDoc(doc(db, "rooms", ROOM_ID, "presence", currentUser), {
      online: false,
      updatedAt: serverTimestamp()
    });
    clearTyping();
  } catch (e) {}
});

// ============================================================
//  LOGOUT
// ============================================================
logoutBtn.addEventListener("click", async () => {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, "rooms", ROOM_ID, "presence", currentUser), {
      online: false,
      updatedAt: serverTimestamp()
    });
    await clearTyping();
  } catch (e) {}
  localStorage.removeItem("chat_key");
  if (unsubMessages) unsubMessages();
  if (unsubTyping) unsubTyping();
  if (unsubPresence) unsubPresence();
  currentUser = null; otherUser = null;
  chatArea.classList.add("hidden");
  startScreen.classList.remove("hidden");
  keyModal.classList.remove("show");
  messagesEl.innerHTML = "";
});
  </script>
</body>
</html>
